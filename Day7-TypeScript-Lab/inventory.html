<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory Utility</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <main class="container py-5">

        <!-- ====================== -->
        <!-- Page Title -->
        <!-- ====================== -->

        <div class="mb-4">
            <h1 class="fw-bold">Inventory Utility</h1>

            <p class="text-muted">
                Manage products using TypeScript and the Inventory API.
            </p>
        </div>


        <!-- ====================== -->
        <!-- Summary -->
        <!-- ====================== -->

        <section class="row g-3 mb-4">

            <!-- Total Inventory Value -->
            <div class="col-md-6">
                <div class="card shadow-sm h-100">

                    <div class="card-body">

                        <h2 class="h6 text-muted">
                            Total Inventory Value
                        </h2>

                        <p id="totalValue" class="fs-3 fw-bold mb-0">
                            0
                        </p>

                    </div>

                </div>
            </div>


            <!-- Low Stock Count -->
            <div class="col-md-6">
                <div class="card shadow-sm h-100">

                    <div class="card-body">

                        <h2 class="h6 text-muted">
                            Low Stock Products
                        </h2>

                        <p id="lowStockCount" class="fs-3 fw-bold mb-0">
                            0
                        </p>

                    </div>

                </div>
            </div>

        </section>


        <!-- ====================== -->
        <!-- Product Form -->
        <!-- ====================== -->

        <section class="card shadow-sm mb-4">

            <div class="card-body">

                <h2 class="h4 mb-3">
                    Product Form
                </h2>

                <form id="productForm">

                    <!-- Hidden ID for editing -->
                    <input type="hidden" id="productId">


                    <div class="row g-3">

                        <!-- Product Name -->
                        <div class="col-md-6">

                            <label for="productName" class="form-label">
                                Product Name
                            </label>

                            <input type="text" id="productName" class="form-control" required>

                        </div>


                        <!-- Category -->
                        <div class="col-md-6">

                            <label for="productCategory" class="form-label">
                                Category
                            </label>

                            <input type="text" id="productCategory" class="form-control" required>

                        </div>


                        <!-- Price -->
                        <div class="col-md-6">

                            <label for="productPrice" class="form-label">
                                Price
                            </label>

                            <input type="number" id="productPrice" class="form-control" min="0" step="0.01" required>

                        </div>


                        <!-- Stock -->
                        <div class="col-md-6">

                            <label for="productStock" class="form-label">
                                Stock
                            </label>

                            <input type="number" id="productStock" class="form-control" min="0" required>

                        </div>

                    </div>


                    <!-- Buttons -->
                    <div class="mt-3">

                        <button type="submit" class="btn btn-primary">
                            Save Product
                        </button>

                        <button type="button" id="cancelEditButton" class="btn btn-secondary">
                            Cancel
                        </button>

                    </div>

                </form>

            </div>

        </section>


        <!-- ====================== -->
        <!-- Search -->
        <!-- ====================== -->

        <section class="card shadow-sm mb-4">

            <div class="card-body">

                <h2 class="h4 mb-3">
                    Find Product
                </h2>

                <div class="input-group">

                    <input type="text" id="searchInput" class="form-control"
                        placeholder="Enter product ID or product name">

                    <button type="button" id="searchButton" class="btn btn-outline-primary">
                        Search
                    </button>

                </div>


                <div id="searchResult" class="mt-3">
                </div>

            </div>

        </section>


        <!-- ====================== -->
        <!-- Product List -->
        <!-- ====================== -->

        <section class="card shadow-sm">

            <div class="card-body">

                <h2 class="h4 mb-3">
                    Products
                </h2>

                <div id="productList">
                    Loading products...
                </div>

            </div>

        </section>

    </main>


    <!-- ====================== -->
    <!-- Compiled TypeScript -->
    <!-- ====================== -->

    <script type="module" src="./dist/inventory.js"></script>

</body>

</html>
